[package]
name = "life-os"
version = "0.1.0"
description = "Local-first, spec-driven life coach"
authors = ["Guillaume Flambard"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "life_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DB: SQLCipher (encryption at rest) + loadable extensions (sqlite-vec)
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "load_extension"] }
sqlite-vec = "0.1"
# Identity, time, secrets
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
rand = "0.8"
keyring = "3"
# Passphrase-based E2E encryption for portable snapshots (scrypt + ChaCha20-Poly1305)
age = "0.10"
# Local AI (Ollama) over localhost HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "1"

[features]
# by default Tauri runs in production mode; custom-protocol used for release
custom-protocol = ["tauri/custom-protocol"]
